apiVersion: apps/v1
kind: Deployment
metadata:
  name: monitoreo-humedad
  namespace: agro
spec:
  replicas: 3
  selector:
    matchLabels:
      app: monitoreo-humedad
  template:
    metadata:
      labels:
        app: monitoreo-humedad
    spec:
      initContainers:
        - name: esperar-bd
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z postgres 5432; do echo esperando base de datos; sleep 2; done"]
      containers:
        - name: app
          image: monitoreo-humedad:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: agro-config
            - secretRef:
                name: agro-secreto
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: monitoreo-humedad
  namespace: agro
spec:
  type: ClusterIP
  selector:
    app: monitoreo-humedad
  ports:
    - port: 80
      targetPort: 8080
