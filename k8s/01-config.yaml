apiVersion: v1
kind: ConfigMap
metadata:
  name: agro-config
  namespace: agro
data:
  DB_URL: "jdbc:postgresql://postgres:5432/agro"
  CAPTCHA_TOKEN_DEMO: "AGRO-CAPTCHA-DEMO"
  SIMULADOR_AUTOARRANQUE: "true"
---
# Solo para la practica academica. En un entorno real las claves NO se guardan en el repositorio.
apiVersion: v1
kind: Secret
metadata:
  name: agro-secreto
  namespace: agro
type: Opaque
stringData:
  DB_USER: "agro"
  DB_PASSWORD: "agro123"
  CAPTCHA_SECRET: ""
