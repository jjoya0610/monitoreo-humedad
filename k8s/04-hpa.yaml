# ELASTICIDAD: Kubernetes sube o baja las replicas segun el uso de CPU (requiere metrics-server).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: monitoreo-humedad
  namespace: agro
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: monitoreo-humedad
  minReplicas: 3
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
