server:
  port: 8080

spring:
  application:
    name: monitoreo-humedad
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/agro}
    username: ${DB_USER:agro}
    password: ${DB_PASSWORD:agro123}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

agro:
  captcha:
    secret: ${CAPTCHA_SECRET:}
    token-demo: ${CAPTCHA_TOKEN_DEMO:AGRO-CAPTCHA-DEMO}
  simulador:
    autoarranque: ${SIMULADOR_AUTOARRANQUE:true}
